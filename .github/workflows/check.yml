name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py --check
      - run: pip install pytest
      # Without SlideMage: tests/bridge/ is skipped.
      - run: python -m pytest -q
